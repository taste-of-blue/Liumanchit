<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Man Chit Liu — Digital Portfolio Space</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Helvetica Neue',Arial,sans-serif; }
  #scene-canvas { position:fixed; inset:0; display:block; touch-action:none; }

  /* Enter overlay */
  #enter-overlay { position:fixed; inset:0; z-index:50; background:radial-gradient(ellipse at center,#0a1628 0%,#000 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; transition:opacity .8s; }
  #enter-overlay.hidden { opacity:0; pointer-events:none; }
  #enter-overlay h1 { font-size:clamp(20px,4vw,40px); letter-spacing:.35em; font-weight:200; margin-bottom:8px; }
  #enter-overlay p.sub { font-size:13px; letter-spacing:.2em; color:#7fb3d9; margin-bottom:40px; }
  #enter-btn { padding:14px 60px; font-size:16px; letter-spacing:.4em; color:#0ff; background:transparent;
    border:1px solid #0ff; cursor:pointer; transition:all .3s; }
  #enter-btn:hover { background:rgba(0,255,255,.15); box-shadow:0 0 30px rgba(0,255,255,.4); }
  #enter-overlay p.hint { margin-top:40px; font-size:11px; color:#557; letter-spacing:.1em; }

  /* HUD */
  #hud { position:fixed; left:0; right:0; bottom:14px; z-index:20; text-align:center; color:rgba(255,255,255,.55);
    font-size:11px; letter-spacing:.12em; pointer-events:none; text-shadow:0 1px 3px #000; }
  #room-label { position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:20; color:rgba(255,255,255,.85);
    font-size:13px; letter-spacing:.35em; pointer-events:none; text-shadow:0 0 12px rgba(0,200,255,.6); }
  #crosshair { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px; border-radius:50%;
    background:rgba(255,255,255,.8); z-index:20; pointer-events:none; box-shadow:0 0 6px rgba(0,255,255,.8); }
  #interact-tip { position:fixed; left:50%; top:56%; transform:translateX(-50%); z-index:20; color:#0ff;
    font-size:12px; letter-spacing:.15em; pointer-events:none; display:none; text-shadow:0 0 8px #0ff; }

  /* Fade flash for portal transition */
  #fade { position:fixed; inset:0; z-index:40; background:#fff; opacity:0; pointer-events:none; transition:opacity .35s; }

  /* Modal */
  #modal-wrap { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.75); display:none;
    align-items:center; justify-content:center; padding:20px; }
  #modal-wrap.open { display:flex; }
  #modal { background:#0b1220; border:1px solid rgba(0,200,255,.35); border-radius:10px; max-width:760px; width:100%;
    max-height:86vh; overflow-y:auto; padding:26px 28px; color:#dfe9f3; box-shadow:0 0 60px rgba(0,150,255,.25); }
  #modal h2 { font-size:20px; letter-spacing:.08em; margin-bottom:4px; color:#fff; }
  #modal .tag { display:inline-block; font-size:10px; letter-spacing:.2em; padding:3px 10px; border-radius:20px; margin-bottom:14px; }
  .tag.red { background:rgba(255,60,80,.15); color:#ff6b7f; border:1px solid rgba(255,60,80,.4); }
  .tag.blue { background:rgba(120,80,255,.18); color:#c9a8ff; border:1px solid rgba(160,110,255,.45); }
  #modal p { font-size:13px; line-height:1.8; color:#aabbcc; margin-bottom:14px; white-space:pre-line; }
  .vid { position:relative; width:100%; padding-bottom:56.25%; margin-bottom:14px; background:#000; border-radius:6px; overflow:hidden; }
  .vid iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  audio { width:100%; margin-bottom:12px; }
  .link-list a { display:block; color:#6fd3ff; font-size:13px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.08); text-decoration:none; }
  .link-list a:hover { color:#fff; }
  #modal-close { position:sticky; top:0; float:right; background:none; border:none; color:#8fa; font-size:22px; cursor:pointer; color:#7fb3d9; }
  #modal-close:hover { color:#fff; }
  .btn-row a { display:inline-block; margin:4px 8px 12px 0; padding:8px 18px; font-size:12px; letter-spacing:.1em;
    border:1px solid rgba(0,200,255,.5); color:#6fd3ff; border-radius:4px; text-decoration:none; }
  .btn-row a:hover { background:rgba(0,200,255,.15); }

  /* Mobile joystick */
  #joy-base { position:fixed; z-index:25; width:110px; height:110px; border-radius:50%;
    border:2px solid rgba(0,255,255,.4); background:rgba(0,40,60,.25); display:none; pointer-events:none;
    transform:translate(-50%,-50%); }
  #joy-knob { position:absolute; left:50%; top:50%; width:46px; height:46px; border-radius:50%;
    background:rgba(0,255,255,.5); box-shadow:0 0 14px rgba(0,255,255,.6); transform:translate(-50%,-50%); }
</style>
</head>
<body>
<canvas id="scene-canvas"></canvas>

<div id="enter-overlay">
  <h1>MAN CHIT LIU</h1>
  <p class="sub">SOUND DESIGN · MUSIC PRODUCTION · TASTE OF BLUE</p>
  <button id="enter-btn">ENTER</button>
  <p class="hint" id="controls-hint">↑↓ WALK · ←→ TURN · DRAG TO LOOK · CLICK GLOWING PANELS</p>
</div>

<div id="room-label">RECEPTION</div>
<div id="crosshair"></div>
<div id="interact-tip">CLICK TO OPEN</div>
<div id="hud">↑↓ WALK · ←→ TURN · DRAG TO LOOK</div>
<div id="joy-base"><div id="joy-knob"></div></div>
<div id="fade"></div>

<div id="modal-wrap">
  <div id="modal">
    <button id="modal-close">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
